name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --prod --audit-level=high

  # Livraison (specs techniques 9.4) : la branche principale va sur l'environnement de
  # développement, un tag de version sur la production. Schéma et règles de synchro d'abord,
  # la PWA ensuite. Réglages attendus : supabase/README.md.
  deploy:
    needs: check
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: ${{ github.ref_type == 'tag' && 'production' || 'development' }}
    concurrency:
      group: deploy-${{ github.ref_type == 'tag' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          : "${SUPABASE_DB_URL:?}"
          npx --yes supabase@3.1.0 db push --remote="$SUPABASE_DB_URL" --yes
      - name: Règles de synchro
        if: vars.POWERSYNC_INSTANCE_ID != ''
        env:
          PS_ADMIN_TOKEN: ${{ secrets.POWERSYNC_TOKEN }}
        run: >-
          npx --yes powersync@0.10.3 deploy sync-config
          --instance-id="${{ vars.POWERSYNC_INSTANCE_ID }}"
          --directory=supabase/sync-streams
          --sync-config-file-path=supabase/sync-streams/sync-streams.yaml
      - name: Build web
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_POWERSYNC_URL: ${{ vars.POWERSYNC_URL }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          EXPO_PUBLIC_APP_ENV: ${{ github.ref_type == 'tag' && 'prod' || 'dev' }}
        # Une valeur vide passerait le build et donnerait une app qui ne se lance pas.
        run: |
          : "${EXPO_PUBLIC_SUPABASE_URL:?}" "${EXPO_PUBLIC_SUPABASE_ANON_KEY:?}" "${EXPO_PUBLIC_POWERSYNC_URL:?}"
          pnpm build:web
      - name: Source maps
        working-directory: apps/mobile
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: node scripts/upload-sourcemaps.mjs
      - name: Déploiement
        working-directory: apps/mobile
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy ${{ github.ref_type != 'tag' && '--env dev' || '' }}
